<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrações 22 - Turismo em Amargosa</title>
  <link rel="icon" type="image/png" href="../public/images/favicon/favicon.png">
  <link rel="apple-touch-icon" href="../public/images/favicon/apple-touch-icon.png">
  <style>
    :root {
      --ink: #fff7d7;
      --muted: rgba(255, 247, 215, 0.78);
      --blue: #3bdfff;
      --pink: #ff43b4;
      --cyan: #21d7e8;
      --deep: rgba(39, 4, 78, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: #5a087f url("../atrações/background-sao-joao.png") center / cover no-repeat fixed;
      color: var(--ink);
      font-family: "Cabin", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 34%, rgba(255, 67, 180, 0.18), rgba(36, 0, 72, 0.2) 58%, rgba(20, 0, 42, 0.34));
      pointer-events: none;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(240px, 0.72fr) minmax(320px, 1.28fr);
      align-items: center;
      gap: clamp(22px, 5vw, 70px);
      padding: clamp(28px, 5vw, 70px) 0;
    }

    .day-panel {
      display: grid;
      gap: 1rem;
      justify-items: start;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border-radius: 999px;
      padding: 0 0.9rem;
      background: rgba(34, 215, 232, 0.18);
      border: 1px solid rgba(34, 215, 232, 0.38);
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 9.5rem);
      line-height: 0.78;
      text-shadow: 0 10px 0 rgba(94, 8, 108, 0.5), 0 30px 60px rgba(0, 0, 0, 0.28);
    }

    .day-panel p {
      max-width: 390px;
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .lineup {
      display: grid;
      gap: 0;
      padding: clamp(0.9rem, 1.7vw, 1.25rem);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(78, 6, 119, 0.58), rgba(33, 0, 68, 0.36));
      box-shadow: 0 26px 80px rgba(20, 0, 42, 0.36);
      backdrop-filter: blur(12px);
    }

    .show-card {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.25rem);
      min-height: 86px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.95rem 1rem;
    }

    .show-card:last-child {
      border-bottom: 0;
    }

    .time {
      color: #34104e;
      background: var(--blue);
      border-radius: 16px;
      padding: 0.55rem 0.65rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 950;
      box-shadow: 0 10px 22px rgba(34, 215, 232, 0.24);
    }

    .artist {
      display: grid;
      gap: 0.22rem;
      min-width: 0;
    }

    .artist strong {
      color: #ffffff;
      font-size: clamp(1.35rem, 3vw, 2.25rem);
      line-height: 0.95;
    }

    .artist span {
      color: var(--muted);
      font-weight: 800;
    }

    .stage-name {
      color: var(--cyan);
      font-weight: 900;
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .stage {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .day-panel {
        justify-items: center;
        text-align: center;
      }

      .day-panel p {
        margin-inline: auto;
      }
    }

    @media (max-width: 620px) {
      .show-card {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .time,
      .stage-name {
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Modelo de atra&ccedil;&otilde;es por dia">
    <section class="day-panel">
      <span class="badge">Quarto dia</span>
      <h1>22<br>jun</h1>
    </section>

    <section class="lineup">
      <article class="show-card">
        <span class="time">19h00</span>
        <div class="artist"><strong>Flor Serena</strong><span>Abertura junina</span></div>
        <span class="stage-name">Palco 2</span>
      </article>
      <article class="show-card">
        <span class="time">20h15</span>
        <div class="artist"><strong>Del Feliz</strong><span>Forr&oacute; de palco</span></div>
        <span class="stage-name">Palco 1</span>
      </article>
      <article class="show-card">
        <span class="time">21h30</span>
        <div class="artist"><strong>Trio da Huanna</strong><span>Arrasta-p&eacute;</span></div>
        <span class="stage-name">Palco 1</span>
      </article>
      <article class="show-card">
        <span class="time">22h45</span>
        <div class="artist"><strong>J&oacute; Miranda</strong><span>Forr&oacute; contempor&acirc;neo</span></div>
        <span class="stage-name">Palco 2</span>
      </article>
      <article class="show-card">
        <span class="time">00h00</span>
        <div class="artist"><strong>Jo&atilde;o Gomes</strong><span>Atra&ccedil;&atilde;o principal</span></div>
        <span class="stage-name">Palco 1</span>
      </article>
      <article class="show-card">
        <span class="time">01h30</span>
        <div class="artist"><strong>Arreio de Ouro</strong><span>Encerramento</span></div>
        <span class="stage-name">Palco 1</span>
      </article>
    </section>
  </main>
</body>
</html>
