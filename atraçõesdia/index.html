<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrações Dia - Turismo em Amargosa</title>
  <link rel="icon" type="image/png" href="../public/images/favicon/favicon.png">
  <link rel="apple-touch-icon" href="../public/images/favicon/apple-touch-icon.png">
  <style>
    :root {
      --ink: #fff7d7;
      --muted: rgba(255, 247, 215, 0.78);
      --blue: #3bdfff;
      --pink: #ff43b4;
      --cyan: #21d7e8;
      --deep: rgba(39, 4, 78, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: #5a087f url("../public/images/atracoes-dia-mobile-bg.png") center top / cover no-repeat fixed;
      color: var(--ink);
      font-family: "Cabin", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 34%, rgba(255, 67, 180, 0.18), rgba(36, 0, 72, 0.2) 58%, rgba(20, 0, 42, 0.34));
      pointer-events: none;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, 0.82fr) minmax(420px, 1.18fr);
      align-items: center;
      gap: clamp(22px, 4vw, 56px);
      padding: clamp(28px, 5vw, 70px) 0;
    }

    .day-panel {
      display: grid;
      gap: 1rem;
      justify-items: center;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border-radius: 999px;
      padding: 0 0.9rem;
      background: rgba(34, 215, 232, 0.18);
      border: 1px solid rgba(34, 215, 232, 0.38);
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .day-switcher {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      width: min(100%, 520px);
      gap: clamp(0.45rem, 2vw, 1rem);
    }

    .day-nav {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(34, 215, 232, 0.46);
      border-radius: 999px;
      background: rgba(34, 215, 232, 0.18);
      color: var(--blue);
      cursor: pointer;
      font-size: 2rem;
      font-weight: 950;
      line-height: 1;
      padding: 0;
      box-shadow: 0 14px 30px rgba(20, 0, 42, 0.28);
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .day-nav__icon {
      display: grid;
      place-items: center;
      width: 1em;
      height: 1em;
      font-size: 2rem;
      line-height: 1;
      transform: translateY(-0.04em);
    }

    #previousDay .day-nav__icon {
      transform: translate(-0.02em, -0.04em);
    }

    #nextDay .day-nav__icon {
      transform: translate(0.02em, -0.04em);
    }

    .day-nav:hover,
    .day-nav:focus-visible {
      background: rgba(34, 215, 232, 0.32);
      border-color: rgba(59, 223, 255, 0.74);
      outline: none;
      transform: translateY(-1px);
    }

    .day-nav:active {
      transform: translateY(1px) scale(0.98);
    }

    .day-title {
      margin: 0;
      font-size: clamp(4rem, 9vw, 7.25rem);
      line-height: 0.82;
      text-align: center;
      text-shadow: 0 10px 0 rgba(94, 8, 108, 0.5), 0 30px 60px rgba(0, 0, 0, 0.28);
    }

    .day-number,
    .day-month {
      display: block;
    }

    .lineup {
      display: grid;
      gap: 0;
      padding: clamp(0.9rem, 1.7vw, 1.25rem);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(78, 6, 119, 0.58), rgba(33, 0, 68, 0.36));
      box-shadow: 0 26px 80px rgba(20, 0, 42, 0.36);
      backdrop-filter: blur(12px);
    }

    .show-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.25rem);
      min-height: 86px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.95rem 1rem;
    }

    .show-card:last-child {
      border-bottom: 0;
    }

    .time {
      display: none;
    }

    .artist {
      display: grid;
      gap: 0.22rem;
      min-width: 0;
    }

    .artist strong {
      color: #ffffff;
      font-size: clamp(1.35rem, 3vw, 2.25rem);
      line-height: 0.95;
    }

    .artist span {
      color: var(--muted);
      font-weight: 800;
    }

    .stage-name {
      color: var(--cyan);
      font-weight: 900;
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .stage {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .day-panel {
        justify-items: center;
        text-align: center;
      }
    }

    @media (max-width: 620px) {
      body {
        background-image: url("../public/images/atracoes-dia-mobile-bg.png");
        background-position: center top;
        background-size: cover;
        background-attachment: fixed;
      }

      body::before {
        background: radial-gradient(circle at 50% 28%, rgba(255, 67, 180, 0.08), rgba(36, 0, 72, 0.12) 58%, rgba(20, 0, 42, 0.24));
      }

      .stage {
        width: min(100% - 20px, 520px);
        gap: 1.05rem;
        min-height: 100vh;
        min-height: 100dvh;
        align-content: start;
        padding-top: clamp(142px, 24vh, 190px);
        padding-bottom: clamp(128px, 18vh, 168px);
      }

      .day-panel {
        width: 100%;
        gap: 0.72rem;
        padding: 0 0.5rem;
      }

      .badge {
        padding: 0.44rem 1.1rem;
        font-size: 0.68rem;
      }

      .day-switcher {
        grid-template-columns: 44px minmax(0, auto) 44px;
        gap: 0.28rem;
        width: 100%;
        max-width: 330px;
      }

      .day-nav {
        width: 44px;
        height: 44px;
      }

      .day-nav__icon {
        font-size: 1.55rem;
      }

      .day-title {
        font-size: clamp(3.25rem, 22vw, 5.9rem);
        line-height: 0.82;
      }

      .day-month {
        font-size: 0.72em;
      }

      .lineup {
        border-radius: 28px;
        padding: 0.55rem 0.8rem 0.9rem;
        background: linear-gradient(180deg, rgba(78, 6, 119, 0.5), rgba(33, 0, 68, 0.28));
      }

      .show-card {
        grid-template-columns: 1fr;
        text-align: center;
        min-height: 0;
        padding: 1.1rem 0.55rem;
      }

      .time,
      .stage-name {
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Modelo de atra&ccedil;&otilde;es por dia">
    <section class="day-panel">
      <span class="badge" id="dayBadge">Primeiro dia</span>
      <div class="day-switcher" aria-label="Navegar entre os dias da programa&ccedil;&atilde;o">
        <button class="day-nav" type="button" id="previousDay" aria-label="Dia anterior"><span class="day-nav__icon" aria-hidden="true">&lsaquo;</span></button>
        <h1 class="day-title"><span class="day-number" id="dayNumber">19</span><span class="day-month">Junho</span></h1>
        <button class="day-nav" type="button" id="nextDay" aria-label="Pr&oacute;ximo dia"><span class="day-nav__icon" aria-hidden="true">&rsaquo;</span></button>
      </div>
    </section>

    <section class="lineup" id="lineup" aria-live="polite"></section>
  </main>
  <script>
    const scheduleDays = [
      {
        badge: "Primeiro dia",
        day: "19",
        shows: [
          ["19h00", "Oficina do Forr&oacute;", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h00", "Fabinho, o Rei da Balada", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["21h00", "Forr&oacute; dos Trem", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["22h00", "Transmiss&atilde;o do Jogo do Brasil no Tel&atilde;o", "Transmiss&atilde;o especial", "Tel&atilde;o"],
          ["23h00", "Thammy", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["00h00", "Cheiro de Milho", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["01h00", "Os Caras de Pau", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"]
        ]
      },
      {
        badge: "Segundo dia",
        day: "20",
        shows: [
          ["18h00", "F&aacute;bio Aquino", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["18h45", "Cajuas do Forr&oacute;", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["19h30", "Trio Resfulengo", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h15", "Z&eacute;u Azevedo", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["21h30", "L&eacute;o Estakazero", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["22h45", "Elba Ramalho", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["00h00", "Jo&atilde;o Gomes", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["01h30", "Al&ecirc; Ferraz", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"]
        ]
      },
      {
        badge: "Terceiro dia",
        day: "21",
        shows: [
          ["18h00", "Vitor Ravel", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["18h45", "Tubaina, Mortadela e P&atilde;o", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["19h30", "Teu Olliver", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h15", "Flor Serena", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["21h30", "J&oacute; Miranda", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["22h45", "Vitor Fernandes", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["00h00", "Del Feliz", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["01h30", "Netto Britto", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"]
        ]
      },
      {
        badge: "Quarto dia",
        day: "22",
        shows: [
          ["18h00", "Jorge Caf&eacute;", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["18h45", "D&iacute;dhio Pereira", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["19h30", "Carlos Augusto", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h15", "Vinny Magalh&atilde;es", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["21h30", "Filomena Bagaceira", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["22h45", "Arreio de Ouro", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["00h00", "F&aacute;bio Carneirinho", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["01h30", "Thiago Aquino", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"]
        ]
      },
      {
        badge: "Quinto dia",
        day: "23",
        shows: [
          ["18h00", "Banda Ser&aacute; que &eacute; Forr&oacute;? com Ronaldo Mendes", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["18h45", "Mesa Dez", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["19h30", "S&eacute;rgio Merengue e Louro dos Teclados", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h15", "Gilvan Filho", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["21h30", "Fl&aacute;vio Leandro", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["22h45", "Arrasta-p&eacute; Bardonovo", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["00h00", "K&aacute;tia e Adu&iacute;lio", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["01h30", "Ful&ocirc; de Mandacaru", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"]
        ]
      },
      {
        badge: "Sexto dia",
        day: "24",
        shows: [
          ["18h00", "Samir Sanfoneiro", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["19h00", "Transmiss&atilde;o do Jogo do Brasil no Tel&atilde;o", "Transmiss&atilde;o especial", "Tel&atilde;o"],
          ["19h30", "Memeu Ramos", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h00", "Elivelton Leal", "Programa&ccedil;&atilde;o oficial", "Palco Manoelito Sena"],
          ["20h15", "Tayrone", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["21h30", "Santanna, O Cantador", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["22h45", "Chambinho", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"],
          ["", "Trio da Huana", "Programa&ccedil;&atilde;o oficial", "Palco Gonzag&atilde;o"]
        ]
      }
    ];

    const dayBadge = document.querySelector("#dayBadge");
    const dayNumber = document.querySelector("#dayNumber");
    const lineup = document.querySelector("#lineup");
    const previousDay = document.querySelector("#previousDay");
    const nextDay = document.querySelector("#nextDay");
    const stage = document.querySelector(".stage");
    const daySwipeMedia = window.matchMedia("(max-width: 620px)");
    let activeDay = getInitialDayIndex();
    let swipeStartX = 0;
    let swipeStartY = 0;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastSwipeAt = 0;

    function getInitialDayIndex(currentDate = new Date()) {
      const eventMonth = 5;
      const eventDays = scheduleDays.map(({ day }) => Number(day));
      const firstEventDay = Math.min(...eventDays);
      const lastEventDay = Math.max(...eventDays);
      const currentMonth = currentDate.getMonth();
      const currentDay = currentDate.getDate();

      if (currentMonth < eventMonth) {
        return 0;
      }

      if (currentMonth > eventMonth) {
        return scheduleDays.length - 1;
      }

      if (currentDay <= firstEventDay) {
        return 0;
      }

      if (currentDay >= lastEventDay) {
        return scheduleDays.length - 1;
      }

      return scheduleDays.findIndex(({ day }) => Number(day) === currentDay);
    }

    function renderDay() {
      const currentDay = scheduleDays[activeDay];
      dayBadge.textContent = currentDay.badge;
      dayNumber.textContent = currentDay.day;
      lineup.innerHTML = currentDay.shows.map(([, artist, description, stage]) => {
        const hiddenDescriptions = ["Programa&ccedil;&atilde;o oficial", "Transmiss&atilde;o especial"];
        const descriptionMarkup = hiddenDescriptions.includes(description) ? "" : `<span>${description}</span>`;

        return `
          <article class="show-card">
            <div class="artist"><strong>${artist}</strong>${descriptionMarkup}</div>
            <span class="stage-name">${stage}</span>
          </article>
        `;
      }).join("");
    }

    function changeDay(direction) {
      activeDay = (activeDay + direction + scheduleDays.length) % scheduleDays.length;
      renderDay();
    }

    function trySwipeDay(deltaX, deltaY) {
      const isHorizontalSwipe = Math.abs(deltaX) > 48 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25;
      const now = Date.now();

      if (!isHorizontalSwipe || now - lastSwipeAt < 320) {
        return;
      }

      lastSwipeAt = now;
      changeDay(deltaX < 0 ? 1 : -1);
    }

    previousDay.addEventListener("click", () => changeDay(-1));
    nextDay.addEventListener("click", () => changeDay(1));
    stage.addEventListener("touchstart", (event) => {
      const touch = event.touches && event.touches[0];

      if (!touch || !daySwipeMedia.matches) {
        return;
      }

      swipeStartX = touch.clientX;
      swipeStartY = touch.clientY;
    }, { passive: true });
    stage.addEventListener("touchend", (event) => {
      const touch = event.changedTouches && event.changedTouches[0];

      if (!touch || !daySwipeMedia.matches) {
        return;
      }

      const deltaX = touch.clientX - swipeStartX;
      const deltaY = touch.clientY - swipeStartY;

      trySwipeDay(deltaX, deltaY);
    }, { passive: true });
    stage.addEventListener("pointerdown", (event) => {
      if (!daySwipeMedia.matches) {
        return;
      }

      pointerStartX = event.clientX;
      pointerStartY = event.clientY;
    });
    stage.addEventListener("pointerup", (event) => {
      if (!daySwipeMedia.matches) {
        return;
      }

      trySwipeDay(event.clientX - pointerStartX, event.clientY - pointerStartY);
    });
    renderDay();
  </script>
</body>
</html>
