<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrações Dia - Turismo em Amargosa</title>
  <link rel="icon" type="image/png" href="../public/images/favicon/favicon.png">
  <link rel="apple-touch-icon" href="../public/images/favicon/apple-touch-icon.png">
  <style>
    :root {
      --ink: #fff7d7;
      --muted: rgba(255, 247, 215, 0.78);
      --blue: #3bdfff;
      --pink: #ff43b4;
      --cyan: #21d7e8;
      --deep: rgba(39, 4, 78, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: #5a087f url("../atrações/background-sao-joao.png") center / cover no-repeat fixed;
      color: var(--ink);
      font-family: "Cabin", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 34%, rgba(255, 67, 180, 0.18), rgba(36, 0, 72, 0.2) 58%, rgba(20, 0, 42, 0.34));
      pointer-events: none;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(240px, 0.72fr) minmax(320px, 1.28fr);
      align-items: center;
      gap: clamp(22px, 5vw, 70px);
      padding: clamp(28px, 5vw, 70px) 0;
    }

    .day-panel {
      display: grid;
      gap: 1rem;
      justify-items: start;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border-radius: 999px;
      padding: 0 0.9rem;
      background: rgba(34, 215, 232, 0.18);
      border: 1px solid rgba(34, 215, 232, 0.38);
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .day-switcher {
      display: grid;
      grid-template-columns: 52px minmax(0, auto) 52px;
      align-items: center;
      gap: clamp(0.45rem, 2vw, 1rem);
    }

    .day-nav {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(34, 215, 232, 0.46);
      border-radius: 999px;
      background: rgba(34, 215, 232, 0.18);
      color: var(--blue);
      cursor: pointer;
      font-size: 2rem;
      font-weight: 950;
      line-height: 1;
      box-shadow: 0 14px 30px rgba(20, 0, 42, 0.28);
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .day-nav:hover,
    .day-nav:focus-visible {
      background: rgba(34, 215, 232, 0.32);
      border-color: rgba(59, 223, 255, 0.74);
      outline: none;
      transform: translateY(-1px);
    }

    .day-nav:active {
      transform: translateY(1px) scale(0.98);
    }

    .day-title {
      margin: 0;
      font-size: clamp(4rem, 12vw, 9.5rem);
      line-height: 0.78;
      text-align: center;
      text-shadow: 0 10px 0 rgba(94, 8, 108, 0.5), 0 30px 60px rgba(0, 0, 0, 0.28);
    }

    .day-number,
    .day-month {
      display: block;
    }

    .lineup {
      display: grid;
      gap: 0;
      padding: clamp(0.9rem, 1.7vw, 1.25rem);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(78, 6, 119, 0.58), rgba(33, 0, 68, 0.36));
      box-shadow: 0 26px 80px rgba(20, 0, 42, 0.36);
      backdrop-filter: blur(12px);
    }

    .show-card {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.25rem);
      min-height: 86px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding: 0.95rem 1rem;
    }

    .show-card:last-child {
      border-bottom: 0;
    }

    .time {
      color: #34104e;
      background: var(--blue);
      border-radius: 16px;
      padding: 0.55rem 0.65rem;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 950;
      box-shadow: 0 10px 22px rgba(34, 215, 232, 0.24);
    }

    .artist {
      display: grid;
      gap: 0.22rem;
      min-width: 0;
    }

    .artist strong {
      color: #ffffff;
      font-size: clamp(1.35rem, 3vw, 2.25rem);
      line-height: 0.95;
    }

    .artist span {
      color: var(--muted);
      font-weight: 800;
    }

    .stage-name {
      color: var(--cyan);
      font-weight: 900;
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .stage {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .day-panel {
        justify-items: center;
        text-align: center;
      }
    }

    @media (max-width: 620px) {
      body {
        background-image: url("../public/images/atracoes-dia-mobile-bg.png");
        background-position: center top;
        background-size: cover;
        background-attachment: fixed;
      }

      body::before {
        background: radial-gradient(circle at 50% 28%, rgba(255, 67, 180, 0.08), rgba(36, 0, 72, 0.12) 58%, rgba(20, 0, 42, 0.24));
      }

      .stage {
        width: min(100% - 24px, 520px);
        padding-top: 48px;
      }

      .day-panel {
        gap: 0.85rem;
      }

      .day-switcher {
        grid-template-columns: 44px minmax(0, auto) 44px;
        gap: 0.35rem;
        width: 100%;
        max-width: 360px;
      }

      .day-nav {
        width: 44px;
        height: 44px;
        font-size: 1.55rem;
      }

      .day-title {
        font-size: clamp(4.6rem, 29vw, 8rem);
      }

      .show-card {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 1.35rem 0.8rem;
      }

      .time,
      .stage-name {
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Modelo de atra&ccedil;&otilde;es por dia">
    <section class="day-panel">
      <span class="badge" id="dayBadge">Primeiro dia</span>
      <div class="day-switcher" aria-label="Navegar entre os dias da programa&ccedil;&atilde;o">
        <button class="day-nav" type="button" id="previousDay" aria-label="Dia anterior">&lsaquo;</button>
        <h1 class="day-title"><span class="day-number" id="dayNumber">19</span><span class="day-month">jun</span></h1>
        <button class="day-nav" type="button" id="nextDay" aria-label="Pr&oacute;ximo dia">&rsaquo;</button>
      </div>
    </section>

    <section class="lineup" id="lineup" aria-live="polite"></section>
  </main>
  <script>
    const scheduleDays = [
      {
        badge: "Primeiro dia",
        day: "19",
        shows: [
          ["19h00", "Flor Serena", "Abertura junina", "Palco 2"],
          ["20h15", "Del Feliz", "Forr&oacute; de palco", "Palco 1"],
          ["21h30", "Trio da Huanna", "Arrasta-p&eacute;", "Palco 1"],
          ["22h45", "J&oacute; Miranda", "Forr&oacute; contempor&acirc;neo", "Palco 2"],
          ["00h00", "Jo&atilde;o Gomes", "Atra&ccedil;&atilde;o principal", "Palco 1"],
          ["01h30", "Arreio de Ouro", "Encerramento", "Palco 1"]
        ]
      },
      {
        badge: "Segundo dia",
        day: "20",
        shows: [
          ["19h00", "Chambinho do Acordeon", "Abertura junina", "Palco 2"],
          ["20h15", "Santanna, O Cantador", "Forr&oacute; tradicional", "Palco 1"],
          ["21h30", "Elba Ramalho", "Atra&ccedil;&atilde;o principal", "Palco 1"],
          ["22h45", "Flor Serena", "Forr&oacute; de palco", "Palco 2"],
          ["00h00", "Arreio de Ouro", "Arrasta-p&eacute;", "Palco 1"],
          ["01h30", "Del Feliz", "Encerramento", "Palco 1"]
        ]
      },
      {
        badge: "Terceiro dia",
        day: "21",
        shows: [
          ["19h00", "K&aacute;tia Cilene", "Abertura junina", "Palco 2"],
          ["20h15", "EstakaZero", "Forr&oacute; das antigas", "Palco 1"],
          ["21h30", "Vitor Fernandes", "Atra&ccedil;&atilde;o principal", "Palco 1"],
          ["22h45", "J&oacute; Miranda", "Forr&oacute; contempor&acirc;neo", "Palco 2"],
          ["00h00", "Trio da Huanna", "Arrasta-p&eacute;", "Palco 1"],
          ["01h30", "Flor Serena", "Encerramento", "Palco 2"]
        ]
      },
      {
        badge: "Quarto dia",
        day: "22",
        shows: [
          ["19h00", "Ful&ocirc; de Mandacaru", "Abertura junina", "Palco 2"],
          ["20h15", "F&aacute;bio Carneirinho", "Forr&oacute; de palco", "Palco 1"],
          ["21h30", "Tayrone", "Atra&ccedil;&atilde;o principal", "Palco 1"],
          ["22h45", "Adu&iacute;lio Mendes", "Forr&oacute; rom&acirc;ntico", "Palco 1"],
          ["00h00", "Del Feliz", "Arrasta-p&eacute;", "Palco 2"],
          ["01h30", "Arreio de Ouro", "Encerramento", "Palco 1"]
        ]
      },
      {
        badge: "Quinto dia",
        day: "23",
        shows: [
          ["19h00", "Z&eacute;u Azevedo", "Abertura junina", "Palco 2"],
          ["20h15", "Neto Brito", "Forr&oacute; de palco", "Palco 1"],
          ["21h30", "Thiago Aquino", "Atra&ccedil;&atilde;o principal", "Palco 1"],
          ["22h45", "Filomena Bagaceira", "Forr&oacute; irreverente", "Palco 1"],
          ["00h00", "Santanna, O Cantador", "Forr&oacute; tradicional", "Palco 2"],
          ["01h30", "Trio da Huanna", "Encerramento", "Palco 1"]
        ]
      },
      {
        badge: "Sexto dia",
        day: "24",
        shows: [
          ["19h00", "Gilvan Filho", "Abertura junina", "Palco 2"],
          ["20h15", "Vinny Magalh&atilde;es", "Forr&oacute; de palco", "Palco 1"],
          ["21h30", "Fl&aacute;vio Leandro", "Atra&ccedil;&atilde;o principal", "Palco 1"],
          ["22h45", "K&aacute;tia Cilene", "Forr&oacute; das antigas", "Palco 2"],
          ["00h00", "F&aacute;bio Carneirinho", "Arrasta-p&eacute;", "Palco 1"],
          ["01h30", "Flor Serena", "Encerramento", "Palco 2"]
        ]
      }
    ];

    const dayBadge = document.querySelector("#dayBadge");
    const dayNumber = document.querySelector("#dayNumber");
    const lineup = document.querySelector("#lineup");
    const previousDay = document.querySelector("#previousDay");
    const nextDay = document.querySelector("#nextDay");
    let activeDay = 0;

    function renderDay() {
      const currentDay = scheduleDays[activeDay];
      dayBadge.textContent = currentDay.badge;
      dayNumber.textContent = currentDay.day;
      lineup.innerHTML = currentDay.shows.map(([time, artist, description, stage]) => `
        <article class="show-card">
          <span class="time">${time}</span>
          <div class="artist"><strong>${artist}</strong><span>${description}</span></div>
          <span class="stage-name">${stage}</span>
        </article>
      `).join("");
    }

    function changeDay(direction) {
      activeDay = (activeDay + direction + scheduleDays.length) % scheduleDays.length;
      renderDay();
    }

    previousDay.addEventListener("click", () => changeDay(-1));
    nextDay.addEventListener("click", () => changeDay(1));
    renderDay();
  </script>
</body>
</html>
